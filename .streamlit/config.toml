[theme]
base = "light"
primaryColor = "#f0a202"
backgroundColor = "#e9eef5"
secondaryBackgroundColor = "#d7e0eb"
textColor = "#0b1d36"
font = "sans serif"

[server]
headless = true
# Avoid Streamlit probing transformers/*/image_processing_* (needs torchvision)
# and spamming ModuleNotFoundError when the embedding model is loaded.
fileWatcherType = "none"

[browser]
gatherUsageStats = false
